  <ellipse cx="32" cy="32" rx="20" ry="28" fill="none" stroke="rgba(0, 229, 255, 0.35)" stroke-width="1.2"/>
  <ellipse cx="32" cy="32" rx="10" ry="28" fill="none" stroke="rgba(0, 229, 255, 0.35)" stroke-width="1.2"/>
  <line x1="4" y1="32" x2="60" y2="32" stroke="rgba(0, 229, 255, 0.45)" stroke-width="1.2"/>
  <line x1="8" y1="18" x2="56" y2="18" stroke="rgba(0, 229, 255, 0.25)" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="8" y1="46" x2="56" y2="46" stroke="rgba(0, 229, 255, 0.25)" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Stylized Continents Outlines -->
  <path d="M22 16c2-3 7-2 9 0 3 2 4 6 2 9-2 3-5 5-7 4-3-1-5-6-4-8z" fill="#06d6a0" opacity="0.85"/>
  <path d="M38 22c3-1 7 1 8 4 1 3-1 6-4 7-3 1-6-2-6-5 0-3 1-5 2-6z" fill="#06d6a0" opacity="0.85"/>
  <path d="M24 38c3-1 5 2 6 5 1 4-2 8-5 7-3-1-4-5-3-8 1-2 1-3 2-4z" fill="#06d6a0" opacity="0.85"/>
